services:
  db:
    image: postgres:17
    container_name: sahibinden_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432" # postgres 5432 portunda
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: