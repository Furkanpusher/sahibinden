services:
  db:
    image: postgres:17
    container_name: sahibinden_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: # image build ediyoruz
      context: .
      dockerfile: Dockerfile
    container_name: sahibinden_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8001
    volumes:
      - .:/app
      - ./media:/app/media
    ports:
      - "8001:8001"
    environment:
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend/ilan-frontend
      dockerfile: Dockerfile
    container_name: sahibinden_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/ilan-frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data: